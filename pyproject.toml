[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-tagger"
dynamic = ["version"]
description = "Stamp files with ephemeris-anchored provenance sidecars"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["skyfield>=1.46"]

[project.optional-dependencies]
media = ["Pillow", "pypdf"]

[project.scripts]
astro-tagger = "astro_tagger.cli:main"

[tool.setuptools]
packages = ["astro_tagger"]

[tool.setuptools.dynamic]
version = {attr = "astro_tagger.__version__"}
